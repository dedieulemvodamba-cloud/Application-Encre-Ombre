    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function(reg) {
              console.log('✅ Service Worker Encre & Ombre actif !', reg.scope);
            })
            .catch(function(err) {
              console.warn('Service Worker registration note:', err);
            });
        });
